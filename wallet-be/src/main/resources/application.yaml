spring:
  application:
    name: wallet

  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  mvc:
    format:
      # Query params like ?expenseDate.greaterThan=2026-10-01 are parsed as ISO dates
      date: iso

  jpa:
    hibernate:
#      none	Hibernate tablolara hiç dokunmaz
#      validate	Tabloların entity'lerle uyuştuğunu kontrol eder, uyuşmazsa uygulama açılmaz. Hiçbir şeyi değiştirmez
#      update	Eksik tablo ve kolonları ekler (şu anki ayar)
#      create	Her açılışta tabloları silip yeniden oluşturur. Tüm veri gider
#      create-drop	create gibidir, ek olarak uygulama kapanınca tabloları siler. Testlerde kullanılır
      ddl-auto: update
    # bu sorguları konsola yazdırır, ama tek uzun satır olarak:
    show-sql: true
    properties:
      hibernate:
        #  aynı sorguyu satırlara bölüp girintili yazar, böylece okuması kolaylaşır:
        format_sql: true

app:
  jwt:
    # Token'ları imzalayan gizli anahtar (Base64, en az 256 bit).
    # Gerçek ortamda JWT_SECRET ortam değişkeninden gelir; buradaki varsayılan sadece geliştirme içindir.
    # Terminalde komutu kendin çalıştırıp kendi değerini yapıştır:
    # [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
    secret: ${JWT_SECRET:N7LpnYfTv5TAw349yiPcFn8MlnojcKZTjHOPsmdEVfM=}
    # Token'ın geçerlilik süresi (milisaniye): 86400000 = 24 saat
    expiration-ms: 86400000
#    expiration-ms: 10000   10 saniye token süresi denemek için

